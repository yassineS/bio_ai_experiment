name: CI

# Temporarily disabled while the project is in early/heavy-iteration phase.
# Agents are running `gofmt`, `go vet`, `go test -race -cover ./...`, `go build ./...`,
# and markdownlint locally and recording the results in each PR description.
#
# To re-enable, replace the manual-only trigger below with:
#   on:
#     push:
#       branches: [ main, develop ]
#     pull_request:
#       branches: [ main, develop ]
#
# The job definitions kept below are the previous configuration, ready to wire back up.

on:
  workflow_dispatch:

jobs:
  noop:
    name: CI disabled
    runs-on: ubuntu-latest
    steps:
      - name: Note
        run: echo "CI is temporarily disabled. Checks are run locally by contributing agents and documented in each PR."

  upstream-parity:
    name: Upstream parity (live)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
      - name: Install htslib build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool \
            zlib1g-dev libbz2-dev liblzma-dev libcurl4-openssl-dev
      - name: Build htslib
        run: |
          cd reference_code/htslib
          autoreconf -i
          ./configure
          make -j"$(nproc)"
      - name: Build samtools
        run: |
          cd reference_code/samtools
          make -j"$(nproc)"
      - name: Run live upstream-parity tests
        run: go test -run Upstream ./tools/...

