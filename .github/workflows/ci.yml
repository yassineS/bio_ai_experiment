name: CI

# Runs on every push to main and every PR targeting main. The repository is a
# SINGLE Go module (github.com/yassineS/bio_ai_experiment) — all jobs operate at
# the repo root, not per-tool. The Go version is read from go.mod via
# `go-version-file` so the toolchain always matches the module's declared version.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: gofmt + vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go' | grep -v '^reference_code/'))
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        run: go vet ./...

  test:
    name: test -race -cover
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: go test
        run: go test -race -coverprofile=coverage.txt -covermode=atomic ./...
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: success()
        with:
          files: ./coverage.txt
          fail_ci_if_error: false

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: go build
        run: go build ./...

  markdown-lint:
    name: markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: |
            **/*.md
            !reference_code

  # Independent re-execution of the byte-exact parity suite against freshly built
  # upstream binaries. This is the canonical, non-self-reported validation the
  # manuscript relies on (docs/manuscript/04 §1, §4b): the parity gate runs in
  # clean CI, not locally by a contributor. Builds htslib/bcftools/samtools from
  # the vendored submodules, then runs every `*Upstream*` parity test.
  upstream-parity:
    name: upstream parity (live)
    runs-on: ubuntu-latest
    steps:
      # Checkout WITHOUT submodules — the vendored reference_code/ tree has ~53
      # submodules (STAR, salmon, canu, …) totalling many GB. This job only needs
      # htslib/bcftools/samtools, so we init just those (shallow) below rather than
      # recursively fetching everything (which is slow, disk-heavy, and fragile).
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Init only the needed upstream submodules
        run: |
          git submodule update --init --depth 1 --recursive reference_code/htslib
          git submodule update --init --depth 1 reference_code/bcftools reference_code/samtools
      - name: Install htslib build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool \
            zlib1g-dev libbz2-dev liblzma-dev libcurl4-openssl-dev
      - name: Build htslib
        run: |
          cd reference_code/htslib
          autoreconf -i && ./configure && make -j"$(nproc)"
      - name: Build bcftools
        run: cd reference_code/bcftools && make -j"$(nproc)"
      - name: Build samtools
        run: cd reference_code/samtools && make -j"$(nproc)"
      # Run upstream-parity tests ONLY for the tools whose upstream binary we just
      # built (samtools, bcftools, the htslib utils) plus the shared htsgo packages.
      # Other tools' *Upstream* tests need their own binaries (bedtools, seqtk, …)
      # which this job does not build; those run in their own future jobs/locally.
      - name: Run live upstream-parity tests
        run: |
          go test -run Upstream \
            ./tools/samtools/... \
            ./tools/bcftools/... \
            ./tools/bgzip/... \
            ./tools/tabix/... \
            ./tools/htsfile/... \
            ./pkg/...
