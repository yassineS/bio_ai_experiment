name: CI

# Runs on every push to main and every PR targeting main. The repository is a
# SINGLE Go module (github.com/yassineS/bio_ai_experiment) — all jobs operate at
# the repo root, not per-tool. The Go version is read from go.mod via
# `go-version-file` so the toolchain always matches the module's declared version.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: gofmt + vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go' | grep -v '^reference_code/'))
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        run: go vet ./...

  test:
    name: test -race -cover
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: go test
        run: go test -race -coverprofile=coverage.txt -covermode=atomic ./...
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: success()
        with:
          files: ./coverage.txt
          fail_ci_if_error: false

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: go build
        run: go build ./...

  markdown-lint:
    name: markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: |
            **/*.md
            !reference_code

  # Independent re-execution of the byte-exact parity suite against freshly built
  # upstream binaries. This is the canonical, non-self-reported validation the
  # manuscript relies on (docs/manuscript/04 §1, §4b): the parity gate runs in
  # clean CI, not locally by a contributor. Builds htslib/bcftools/samtools from
  # the vendored submodules, then runs every `*Upstream*` parity test.
  upstream-parity:
    name: upstream parity (live)
    runs-on: ubuntu-latest
    steps:
      # Checkout WITH the 11 kept submodules (the unported survey submodules were
      # removed, so `recursive` is now cheap). The live-parity tests build each
      # upstream binary on demand from its submodule; when a tool's submodule or
      # build is unavailable the test SKIPs (it does not fail), so this job
      # enforces parity for every tool it can build and degrades gracefully for
      # any it cannot.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Install upstream build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool \
            pkg-config perl zlib1g-dev libbz2-dev liblzma-dev \
            libcurl4-openssl-dev libdeflate-dev
      # Pre-build the htslib core (most-exercised; the other tools build on demand
      # inside the test helpers).
      - name: Build htslib core
        run: |
          (cd reference_code/htslib && autoreconf -i && ./configure && make -j"$(nproc)")
          (cd reference_code/bcftools && make -j"$(nproc)")
          (cd reference_code/samtools && make -j"$(nproc)")
      # Run the full tool + htsgo suite against the upstream binaries — the
      # independent, non-self-reported re-execution of the byte-exact parity gate
      # (docs/manuscript/04 §1, §4b). Live-parity tests build their upstream binary
      # on demand and enforce; absent/unbuildable ones skip.
      - name: Run live parity suite
        run: go test ./tools/... ./pkg/...
