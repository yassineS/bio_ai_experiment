name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
      
      - name: Run gofmt
        run: |
          # Check if any Go files exist
          if find . -name "*.go" -not -path "./vendor/*" | grep -q .; then
            unformatted=$(gofmt -l $(find . -name "*.go" -not -path "./vendor/*"))
            if [ -n "$unformatted" ]; then
              echo "The following files are not formatted:"
              echo "$unformatted"
              exit 1
            fi
          else
            echo "No Go files found, skipping gofmt"
          fi
      
      - name: Run go vet
        run: |
          # Check if any Go modules exist
          if find . -name "go.mod" -not -path "./vendor/*" | grep -q .; then
            for dir in $(find . -name "go.mod" -not -path "./vendor/*" -exec dirname {} \;); do
              echo "Running go vet in $dir"
              (cd "$dir" && go vet ./...)
            done
          else
            echo "No Go modules found, skipping go vet"
          fi

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
      
      - name: Run tests
        run: |
          # Check if any Go modules exist
          if find . -name "go.mod" -not -path "./vendor/*" | grep -q .; then
            for dir in $(find . -name "go.mod" -not -path "./vendor/*" -exec dirname {} \;); do
              echo "Running tests in $dir"
              (cd "$dir" && go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...)
            done
          else
            echo "No Go modules found, skipping tests"
          fi
      
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        if: success()
        with:
          files: ./coverage.txt
          fail_ci_if_error: false

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
      
      - name: Build tools
        run: |
          # Check if any Go modules exist
          if find . -name "go.mod" -not -path "./vendor/*" | grep -q .; then
            for dir in $(find . -name "go.mod" -not -path "./vendor/*" -exec dirname {} \;); do
              echo "Building in $dir"
              (cd "$dir" && go build -v ./...)
            done
          else
            echo "No Go modules found, skipping build"
          fi

  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Lint Markdown files
        uses: avto-dev/markdown-lint@v1
        with:
          args: '**/*.md'
          ignore: 'vendor'
