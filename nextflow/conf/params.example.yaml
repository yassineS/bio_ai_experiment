# Example params file for `tw launch ... --params-file` or `nextflow run -params-file`.
#
# These mirror conf/hg002_grch38.config (GIAB HG002 / GRCh38). VERIFY the S3 keys
# before launching (they drift) — see conf/hg002_grch38.config and the README.
# Override exome_bed and outdir for your environment.

tiers:  [chr20, exome]
reps:   3
chrom:  chr20

# Reference (GRCh38 no-alt analysis set, bgzipped FASTA with .fai/.gzi).
ref_fasta: s3://giab/release/references/GRCh38/GCA_000001405.15_GRCh38_no_alt_analysis_set.fasta.gz

# WGS alignment (HG002 GRCh38 Illumina ~300x novoalign). Full BAM is ~560 GB.
wgs_bam: s3://giab/data/AshkenazimTrio/HG002_NA24385_son/NIST_HiSeq_HG002_Homogeneity-10953946/NHGRI_Illumina300X_AJtrio_novoalign_bams/HG002.GRCh38.300x.bam
wgs_bai: s3://giab/data/AshkenazimTrio/HG002_NA24385_son/NIST_HiSeq_HG002_Homogeneity-10953946/NHGRI_Illumina300X_AJtrio_novoalign_bams/HG002.GRCh38.300x.bam.bai

# NIST v4.2.1 benchmark truth set.
benchmark_vcf: s3://giab/release/AshkenazimTrio/HG002_NA24385_son/NISTv4.2.1/GRCh38/HG002_GRCh38_1_22_v4.2.1_benchmark.vcf.gz
benchmark_tbi: s3://giab/release/AshkenazimTrio/HG002_NA24385_son/NISTv4.2.1/GRCh38/HG002_GRCh38_1_22_v4.2.1_benchmark.vcf.gz.tbi
highconf_bed:  s3://giab/release/AshkenazimTrio/HG002_NA24385_son/NISTv4.2.1/GRCh38/HG002_GRCh38_1_22_v4.2.1_benchmark_noinconsistent.bed

# Raw Illumina FASTQ (used by the wgs tier's QC cells; verify the lane keys).
fastq_r1: s3://giab/data/AshkenazimTrio/HG002_NA24385_son/NIST_HiSeq_HG002_Homogeneity-10953946/HG002Run01_S1/HG002_HiSeq300x_fastq/140528_D00360_0018_AH8VC6ADXX/Project_RM8391_RM8392/Sample_2A1/2A1_CGATGT_L001_R1_001.fastq.gz
fastq_r2: s3://giab/data/AshkenazimTrio/HG002_NA24385_son/NIST_HiSeq_HG002_Homogeneity-10953946/HG002Run01_S1/HG002_HiSeq300x_fastq/140528_D00360_0018_AH8VC6ADXX/Project_RM8391_RM8392/Sample_2A1/2A1_CGATGT_L001_R2_001.fastq.gz

# YOU must supply this — capture-kit exome target BED (GRCh38, chr-prefixed).
exome_bed: s3://CHANGE-ME/exome_targets.GRCh38.bed

# Gene annotation (RefSeq GRCh38). Gencode alternative is in the config.
gene_gff: https://ftp.ncbi.nlm.nih.gov/genomes/all/GCF/000/001/405/GCF_000001405.40_GRCh38.p14/GCF_000001405.40_GRCh38.p14_genomic.gff.gz

# Where results go (S3 on AWS Batch).
outdir: s3://CHANGE-ME/results
