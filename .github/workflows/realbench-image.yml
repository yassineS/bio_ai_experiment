name: realbench container image

# Builds the realbench benchmark/parity container (our Go binaries + the upstream
# binaries from the submodules) and pushes it to GHCR, so the Seqera/Nextflow
# pipeline (test/nextflow) has a ready image without anyone building Docker
# locally. Manual by default; also rebuilds when the Dockerfile or the harness
# changes on main.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - test/nextflow/Dockerfile
      - pipeline/realbench/**
      - pipeline/cmd/realbench/**
      - go.mod
      - .github/workflows/realbench-image.yml

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules — the image builds upstream from reference_code/)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set lowercase image name
        id: img
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/bio-ai-realbench" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: test/nextflow/Dockerfile
          push: true
          tags: |
            ${{ steps.img.outputs.ref }}:latest
            ${{ steps.img.outputs.ref }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "Pushed ${{ steps.img.outputs.ref }}:latest" >> "$GITHUB_STEP_SUMMARY"
          echo "Make the package PUBLIC (Packages -> bio-ai-realbench -> Package settings -> Change visibility) so a Seqera compute env can pull it without registry credentials." >> "$GITHUB_STEP_SUMMARY"
